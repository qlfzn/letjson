<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LetJSON</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <header id="topbar">
      <div class="brand-block">
        <div class="brand"><span class="prompt">&gt;_</span> LetJSON</div>
        <p class="tagline">Generate new JSON data with only 3 steps</p>
      </div>
      <ol class="progress">
        <li class="step active" data-step="1">
          <span class="dot">1</span><span class="label">Paste</span>
        </li>
        <li class="step" data-step="2">
          <span class="dot">2</span><span class="label">Fill</span>
        </li>
        <li class="step" data-step="3">
          <span class="dot">3</span><span class="label">Generate</span>
        </li>
      </ol>
    </header>

    <main id="stage">
      <section class="panel" id="panel-paste">
        <h2 class="panel-title">// 01 - Paste JSON</h2>
        <textarea id="jsonField" placeholder="Paste JSON here"></textarea>
        <p id="error" class="error"></p>
        <button onclick="parseJSON()">Check</button>
      </section>

      <section class="panel" id="panel-fill">
        <h2 class="panel-title">// 02 - Fill form</h2>
        <form id="jsonForm"></form>
      </section>

      <section class="panel" id="panel-out">
        <h2 class="panel-title">// 03 - Output</h2>
        <pre id="output"></pre>
        <div class="actions">
          <button id="generateBtn" onclick="generateJSON()">Generate JSON</button>
          <button onclick="copyJSON()">Copy</button>
          <button onclick="downloadJSON()">Download .json</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
